url: https://josiahparry.github.io/geoarrowrs/
repo:
  url:
    home: https://github.com/JosiahParry/geoarrowrs
    source: https://github.com/JosiahParry/geoarrowrs/blob/main/
    issue: https://github.com/JosiahParry/geoarrowrs/issues/
    user: https://github.com/
template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#974ba8"
    bg: "#ffffff"
    fg: "#1f131a"
    navbar-light-bg: "#f8f4f6"
    navbar-dark-bg: "#0e080d"
    enable-rounded: false


reference:
  - title: Read
    contents:
      - has_concept("io")

  - title: Construct
    contents:
      - has_concept("construct")

  - title: Area
    contents:
      - has_concept("area")

  - title: Distance
    contents:
      - has_concept("distance")

  - title: Measure
    contents:
      - has_concept("length")
      - has_concept("bearing")
      - has_concept("destination")

  - title: Index
    contents:
      - has_concept("index")

  - title: Relate
    contents:
      - has_concept("topology")
      - has_concept("intersection")

  - title: Locate
    contents:
      - has_concept("query")

  - title: Hulls and bounds
    contents:
      - has_concept("boundary")

  - title: Tessellate
    contents:
      - has_concept("triangulate")
      - has_concept("voronoi")

  - title: Cluster
    contents:
      - has_concept("cluster")

  - title: Combine
    contents:
      - has_concept("boolean")

  - title: Transform
    contents:
      - has_concept("affine")
      - has_concept("simplify")
      - has_concept("convert")

  - title: Interpolate
    contents:
      - has_concept("interpolate")
      - has_concept("densify")

  - title: Winding
    contents:
      - has_concept("winding")

  - title: Inspect
    contents:
      - has_concept("iteration")
      - has_concept("validation")

  - title: Cast
    contents:
      - has_concept("cast")

  - title: Misc
    contents:
      - has_concept("misc")
      - register_geoarrow_udfs
