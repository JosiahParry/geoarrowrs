[package]
name = "geoarrowrs"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]
name = "geoarrowrs"


[dependencies]
anyhow = "1.0.102"
arrow = "58.3.0"
arrow_extendr = { version = "58.1.1", features = ["arrow", "geoarrow-08"] }
# extendr-api = { version = "*", features = ["either"] }
extendr-api = { git = "https://github.com/extendr/extendr", features = [
    "either",
] }
geo = "0.33.1"
geo-traits = { version = "0.3.0" }
# default features pull in reqwest, native-tls and security-framework for the
# http reader; we only ever open a local File, so drop them
flatgeobuf = { version = "5.0.0", default-features = false }
geojson = "0.24.2"
# preserve_order keeps property columns in document order rather than sorting them
serde_json = { version = "1", features = ["preserve_order"] }
geoarrow = { version = "0.8.0" }
rayon = "1.10"
geoarrow-array = "0.8.0"
geoarrow-flatgeobuf = "0.8.0"
geoarrow-geojson = "0.8.0"
# NOTE: `geo-traits` alone does not compile in shapefile 0.9.0 -- its
# geo_traits_impl.rs references `Error::OrphanedInnerRing`, which is gated
# behind `geo-types`. Both features are required until that is fixed upstream.
shapefile = { version = "0.9.0", features = ["geo-traits", "geo-types"] }
geoarrow-cast = "0.8.0"
geo-index = "0.3.4"

[profile.release]
lto = true
codegen-units = 1

# arrow_extendr pulls extendr-api and extendr-ffi from crates.io while this
# crate pulls them from git. Both declare `links = "R"`, and cargo permits only
# one package per links value, so force everything onto the git source.
[patch.crates-io]
extendr-api = { git = "https://github.com/extendr/extendr" }
extendr-ffi = { git = "https://github.com/extendr/extendr" }
